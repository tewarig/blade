name: "Create Random File PR"

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Name of the file to create in the repository"
        required: false
        default: "random-file.txt"
      filecontent:
        description: "Content to include in the file (leave blank to auto-generate random text)"
        required: false
        default: ""

jobs:
  create-pr:
    runs-on: ubuntu-latest
    # ensure the job can push and open a PR
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1. checkout full history so we can push a new branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. decide what text we’ll put in the file
      - name: Generate file content
        id: gen
        run: |
          if [ -z "${{ github.event.inputs.filecontent }}" ]; then
            TEXT="Random text generated on $(date) – $RANDOM"
          else
            TEXT="${{ github.event.inputs.filecontent }}"
          fi
          echo "text=$TEXT" >> "$GITHUB_OUTPUT"

      # 3. create the file
      - name: Create new file with content
        run: |
          FILE_NAME="${{ github.event.inputs.filename }}"
          [ -z "$FILE_NAME" ] && FILE_NAME="random-file.txt"
          echo "${{ steps.gen.outputs.text }}" > "$FILE_NAME"

      # 4. commit & push to a brand-new branch
      - name: Commit and push changes
        env:
          BRANCH_NAME: random-file-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add "${{ github.event.inputs.filename }}"
          git commit -m "feat: add random file ${{ github.event.inputs.filename }}"
          git push origin "$BRANCH_NAME"

      # 5. create the pull request
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: random-file-${{ github.run_id }}
          base: master
          title: "feat: add random file"
          body: |
            This PR was automatically generated by the **Create Random File PR** workflow.
            It adds `${{ github.event.inputs.filename }}` containing random or provided text.
          commit-message: "feat: add random file"
          delete-branch: true   # cleans up after merge

      # 6. surface the PR URL in the logs