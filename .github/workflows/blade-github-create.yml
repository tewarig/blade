name: Create PR from Manual Run

on:
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Create a new branch from master
      - name: Create and checkout new branch
        run: |
          git fetch origin
          git checkout -b auto/update-${{ github.run_number }}

      # Make tracked file changes and commit
      - name: Modify tracked file
        run: |
          echo "Tracked: $(date +%s)" > report.txt
          git add report.txt
          git commit -m "Update tracked file"

      # Add and commit untracked file
      - name: Add new untracked file
        run: |
          echo "Untracked: $(date +%s)" > new-report.txt
          git add new-report.txt
          git commit -m "Add new report file"

      # Push the new branch
      - name: Push branch
        run: |
          git push origin HEAD

      # Create Pull Request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Auto: update reports"
          title: "Automated PR: Update reports"
          body: "This PR includes updated report files."
          branch: feat/auto-update-${{ github.run_number }}
