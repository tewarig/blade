name: Create PR on Demand

on:
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Git config
        run: |
          git config user.name 'Your Name'
          git config user.email 'your-email@example.com'

      - name: Modify tracked file
        run: |
          date +%s > report.txt
          git commit -am "Modify tracked file during workflow"

      - name: Add new untracked file
        run: |
          date +%s > new-report.txt
          git add new-report.txt
          git commit -m "Add untracked file during workflow"

      - name: Make uncommitted change
        run: date +%s > report.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Automated changes"
          title: "Automated PR: Update reports"
          body: |
            This PR was created automatically via GitHub Actions.
          branch: auto/pr-update-${{ github.run_number }}
