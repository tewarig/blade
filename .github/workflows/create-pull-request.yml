name: Create Empty File PR

on:
  workflow_dispatch:   # Allows you to trigger this workflow manually

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch
        run: |
          BRANCH="add-empty-file-$(date +%s)"
          git checkout -b $BRANCH
          echo "" > empty.txt
          git add empty.txt
          git commit -m "Add empty file"
          git push origin $BRANCH
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Add empty file"
          body: "This PR adds an empty file called empty.txt"
          head: ${{ env.BRANCH }}
          base: master
      - name: Check PR Creation Result
        run: |
          if [ "${{ steps.create-pr.outcome }}" = "failure" ]; then
            echo "❌ PR creation failed"
            exit 1
          elif [ "${{ steps.create-pr.outputs.pull-request-number }}" = "" ]; then
            echo "⚠️ PR creation succeeded but no PR number returned - likely a silent failure"
            exit 1
          else
            echo "✅ PR created successfully: #${{ steps.create-pr.outputs.pull-request-number }}"
            echo "🔗 PR URL: ${{ steps.create-pr.outputs.pull-request-url }}"
          fi
